<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Barcode Scanner</title>
    <script type="module" src="/build/av-inputs.esm.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .scanner-section {
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8f9fa;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        button.danger {
            background: #dc3545;
        }

        button.success {
            background: #28a745;
        }

        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-radius: 4px;
        }

        .log-entry.info {
            background: #d4edda;
            color: #155724;
        }

        .log-entry.success {
            background: #cfe2ff;
            color: #084298;
        }

        .log-entry.error {
            background: #f8d7da;
            color: #721c24;
        }

        .result {
            background: #e7f3ff;
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-weight: 600;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result.empty {
            background: #f8f9fa;
            border-color: #dee2e6;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Test Barcode Scanner Component</h1>

        <div class="scanner-section">
            <h3>Escáner de Códigos de Barras y QR</h3>

            <div style="text-align: center; margin: 20px 0;">
                <input-barcode
                    id="barcode-scanner"
                    width="400px"
                    height="300px"
                    auto-start="false">
                </input-barcode>
            </div>

            <div class="controls">
                <button onclick="startScanner()">🟢 Iniciar Escáner</button>
                <button onclick="stopScanner()" class="danger">🛑 Detener Escáner</button>
                <button onclick="clearResult()">🗑️ Limpiar Resultado</button>
                <button onclick="clearLog()">📝 Limpiar Log</button>
            </div>

            <div class="result empty" id="scan-result">
                Esperando código...
            </div>
        </div>

        <!-- Log de Eventos -->
        <div class="log" id="event-log">
            <div class="log-entry info">[INFO] Scanner de códigos inicializado. Presiona "Iniciar Escáner" para comenzar.</div>
        </div>
    </div>

    <script>
        // Referencias a elementos
        const barcodeScanner = document.getElementById('barcode-scanner');
        const scanResult = document.getElementById('scan-result');
        const eventLog = document.getElementById('event-log');

        // Función para logging
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            eventLog.insertBefore(entry, eventLog.firstChild);

            // Mantener solo los últimos 15 logs
            if (eventLog.children.length > 15) {
                eventLog.removeChild(eventLog.lastChild);
            }
        }

        // Función para mostrar resultado
        function showResult(data) {
            scanResult.textContent = data;
            scanResult.className = 'result';
        }

        // Funciones de control
        async function startScanner() {
            try {
                await barcodeScanner.start();
                addLog('Escáner iniciado correctamente', 'success');
            } catch (error) {
                addLog(`Error al iniciar escáner: ${error.message}`, 'error');
                console.error('Scanner start error:', error);
            }
        }

        async function stopScanner() {
            try {
                await barcodeScanner.stop();
                addLog('Escáner detenido', 'info');
            } catch (error) {
                addLog(`Error al detener escáner: ${error.message}`, 'error');
                console.error('Scanner stop error:', error);
            }
        }

        function clearResult() {
            scanResult.textContent = 'Esperando código...';
            scanResult.className = 'result empty';
            addLog('Resultado limpiado', 'info');
        }

        function clearLog() {
            eventLog.innerHTML = '<div class="log-entry info">[INFO] Log limpiado.</div>';
        }

        // Event listeners
        barcodeScanner.addEventListener('scan', (event) => {
            const scannedData = event.detail;
            showResult(scannedData);
            addLog(`Código escaneado: ${scannedData}`, 'success');
        });

        barcodeScanner.addEventListener('inputChange', () => {
            addLog('Input change event emitido', 'info');
        });

        barcodeScanner.addEventListener('valueChange', () => {
            addLog('Value change event emitido', 'info');
        });

        // Detectar errores en el componente
        window.addEventListener('error', (event) => {
            if (event.error && event.error.message.includes('QR_CODE')) {
                addLog(`Error detectado: ${event.error.message}`, 'error');
                console.error('Window error related to QR_CODE:', event.error);
            }
        });

        // Log de debugging adicional
        setTimeout(() => {
            addLog('Verificando estado del componente...', 'info');

            // Verificar si el componente está cargado
            if (barcodeScanner.componentOnReady) {
                barcodeScanner.componentOnReady().then(() => {
                    addLog('Componente listo para usar', 'success');
                }).catch((error) => {
                    addLog(`Error en componentOnReady: ${error.message}`, 'error');
                });
            }

            // Verificar propiedades del componente
            const props = {
                width: barcodeScanner.width,
                height: barcodeScanner.height,
                autoStart: barcodeScanner.autoStart,
                supportedFormats: barcodeScanner.supportedFormats
            };

            addLog(`Props del componente: ${JSON.stringify(props)}`, 'info');
        }, 1000);

        addLog('Página cargada. Listo para probar el escáner.', 'success');
    </script>
</body>
</html>
